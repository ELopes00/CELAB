<body>
  <div id="app"></div>

  <pre id="saida">executando…</pre>

  <script>
    // Liga no emulador local (Auth + Firestore) em vez do projeto de
    // produção — precisa ser setado ANTES de js/firebase.js carregar. Nunca
    // é setado em index.html, então o site publicado nunca entra aqui.
    window.SAGETI_USE_EMULATOR = true;

  <script>
    window.__erros = [];
    window.addEventListener('error', function (e) {
      window.__erros.push('ERRO GLOBAL: ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
    });
  </script>

  <script defer>
    (function () {
      var linhas = [];
      var ok = 0, falhas = 0;

      /* `t` aceita testes síncronos OU assíncronos (que devolvem uma Promise) —
         a suite inteira roda em sequência, sempre esperando o teste anterior
         terminar antes do próximo, igual à ordem síncrona de antes. */
      async function t(nome, fn) {
        try {
          var r = await fn();
          if (r === false) { falhas++; linhas.push('FALHA  ' + nome); }
          else { ok++; linhas.push('ok     ' + nome + (typeof r === 'string' ? '  → ' + r : '')); }
        } catch (e) {
          falhas++;
          linhas.push('ERRO   ' + nome + '  → ' + (e && e.message) + '\n       ' +
            String(e && e.stack || '').split('\n')[1]);
        }
      }
      function eq(a, b, rot) {
        if (a !== b) throw new Error((rot || 'esperado') + ': ' + JSON.stringify(b) + ', obtido ' + JSON.stringify(a));
        return String(a);
      }

      /** Espera até `condicaoFn()` virar true — usado depois de gravações no
          Firestore, cujo eco (via onSnapshot) atualiza o espelho local um
          instante depois da Promise da escrita resolver. */
      function aguardar(condicaoFn, timeoutMs) {
        timeoutMs = timeoutMs || 15000;
        var inicio = Date.now();
        return new Promise(function (resolve, reject) {
          (function tick() {
            var r;
            try { r = condicaoFn(); } catch (e) { r = false; }
            if (r) return resolve();
            if (Date.now() - inicio > timeoutMs) return reject(new Error('tempo esgotado esperando a condição'));
            setTimeout(tick, 40);
          })();
        });
      }

      async function rodar() {
        var C = window.SAGETI;
        var S = C.store, U = C.util;
        var L = C.listas;

        /* ---- 0. Login e espera pelo boot ---- */
        // app.js já disparou store.inicializar()/auth._iniciar() no load.
        // Login autentica de verdade contra o emulador — as regras do
        // Firestore (as mesmas de produção) passam a valer a partir daqui.
        var eventos = [];
        var cancelarPrincipal = null;

        await t('login com a credencial do administrador', async function () {
          var res = await C.auth.entrar('admin', 'root123');
          if (!res.ok) throw new Error(res.erro);
          eq(res.usuario.perfil, 'admin', 'perfil');
          if (!C.auth.permissao('podeExcluir')) throw new Error('admin sem permissão de exclusão');
          return 'admin autenticado';
        });

        await t('listas do Firestore chegam ao espelho local', async function () {
          await aguardar(function () { return L.get('setores').length === 175; });
          eq(L.get('equipamentos').length, 14, 'equipamentos');
          eq(L.get('modelos').length, 45, 'modelos');
          eq(L.get('predios').length, 32, 'prédios');
          eq(L.get('tecnicos').length, 15, 'técnicos');
          return '175 setores · 15 técnicos · 45 modelos';
        });

        cancelarPrincipal = S.assinar(function (ev) { eventos.push(ev.tipo); });

        /* Semeia o mesmo conjunto fictício que o antigo seedDemo() criava
           sozinho no boot — agora ninguém semeia automaticamente, então o
           teste faz isso explicitamente, contra o Firestore emulado. */
        async function semear() {
          var base = new Date();
          function diasAtras(n) { return new Date(base.getTime() - n * 86400000).toISOString().slice(0, 10); }
          var demo = [
            { cat: 'Monitor', mod: 'LG 24BL550J-B', tn: '045112', ta: '11233', st: 'Entrada de Estoque', pr: 'Sede Administrativa', se: 'STI - Secretaria de Tecnologia da Informação', dias: 12 },
            { cat: 'Monitor', mod: 'HP P22A G4', tn: '045118', ta: '', st: 'Estoque', pr: 'Forum Civel', se: '1CIR - 1ª Vara Cível Residual', dias: 10 },
            { cat: 'Monitor', mod: 'Positivo 22MP55PY', tn: '045230', ta: '10877', st: 'Devolucao Defeito', pr: 'Palácio', se: 'PR – Presidência', dias: 9 },
            { cat: 'Computador', mod: 'Lenovo ThinkCentre M75q', tn: '046001', ta: '', st: 'Estoque', pr: 'Sede Administrativa', se: 'SUBSI - Subsecretaria de Sistemas', dias: 8 },
            { cat: 'Computador', mod: 'Positivo Master 820', tn: '046010', ta: '09912', st: 'Manutenção', pr: 'Forum Criminal', se: '2° Vara Criminal', dias: 7 },
            { cat: 'Computador', mod: 'Positivo Minipro 810', tn: '046022', ta: '', st: 'Manutenção', pr: 'CB - Comarca de Bonfim', se: 'CB - Comarca de Bonfim', dias: 6 },
            { cat: 'Impressora', mod: 'HP Pro M404DW', tn: '047300', ta: '08820', st: 'Devolução', pr: 'Forum Civel', se: 'SPAPCIVEL - Setor de Primeiro Atendimento e Protocolo Cível', dias: 6 },
            { cat: 'Impressora', mod: 'OKI 5112', tn: '047311', ta: '', st: 'Leilão', pr: 'AG - Arquivo Geral', se: 'SARG - Setor de Arquivo Geral', dias: 5 },
            { cat: 'Nobreak', mod: 'Ragtech Easy Way 1200', tn: '048500', ta: '07741', st: 'Estoque', pr: 'Sede Administrativa', se: 'SUBINF - Subsecretaria de Infraestrutura de TIC', dias: 5 },
            { cat: 'Nobreak', mod: 'Ragtech Easy Way 1200', tn: '048501', ta: '', st: 'Defeito', pr: 'NUPAC', se: 'NUPAC - Núcleo Plantão Judicial e Audiências de Custódia', dias: 4 },
            { cat: 'Notebook', mod: 'Positivo N6440', tn: '049100', ta: '', st: 'Devolução Empréstimo', pr: 'Vara Infancia e Juventude', se: 'SUVIJ - Secretaria Unificada das Varas da Infância e Juventude', dias: 4 },
            { cat: 'Scanner', mod: 'Kodak ScanMate i1150', tn: '050220', ta: '06630', st: 'Estoque', pr: 'Forum Civel', se: 'SDCRIM - Setor de Distribuição Criminal', dias: 3 },
            { cat: 'Scanner', mod: 'Avision AD345G', tn: '050231', ta: '', st: 'Manutenção', pr: 'CC - Comarca de Caracarai', se: 'CC - Comarca de Caracaraí', dias: 3 },
            { cat: 'Headset', mod: 'Logitech', tn: '051010', ta: '', st: 'Estoque', pr: 'NCTC - Nucleo de Conciliacao do Terminal do Centro', se: 'CEJUSCS - Centros Judiciários de Soluções de Conflitos', dias: 2 },
            { cat: 'Webcam', mod: 'Logitech C925e', tn: '051500', ta: '', st: 'Estoque', pr: 'Casa da Mulher Brasileira', se: 'Casa da Mulher Brasileira', dias: 2 },
            { cat: 'HDMI', mod: 'HDMI - 10M', tn: '052001', ta: '', st: 'Estoque', pr: 'Conj. Desembargadores', se: 'TP - Tribunal Pleno', dias: 2 },
            { cat: 'Projetor Multimidia', mod: 'EPSON POWERLITE X29', tn: '053000', ta: '05512', st: 'Devolução Eq. Obsoleto', pr: 'Palácio', se: 'EJURR - Escola do Poder Judiciário', dias: 1 },
            { cat: 'Eq. Video Conf.', mod: 'GoPresence Teams 10x', tn: '054000', ta: '', st: 'Estoque', pr: 'Sede Administrativa', se: 'SG - Secretaria Geral', dias: 1 }
          ];
          var ttrE = L.ttrDe('entrada');
          for (var i = 0; i < demo.length; i++) {
            var d = demo[i];
            var r = await S.registrarEntrada({
              dataEntrada: diasAtras(d.dias), chamado: 'CH-' + (10450 + i),
              tomboNovo: d.tn, tomboAntigo: d.ta, equipamento: d.cat, modelo: d.mod,
              servicoSolicitado: 'Recolhimento para avaliação técnica e conferência de patrimônio.',
              status: d.st, predioOrigem: d.pr, setorOrigem: d.se, ttr: ttrE[i % 3 === 0 ? 1 : 0]
            }, { usuario: 'sistema' });
            if (!r.ok) throw new Error('seed falhou em ' + d.tn + ': ' + r.erro);
          }
          var ttrS = L.ttrDe('saida'), tecnicos = L.get('tecnicos');
          var s1 = await S.registrarSaida({
            dataSaida: diasAtras(1), chamado: 'CH-10480', tomboNovo: '045118', tomboAntigo: '',
            equipamento: 'Monitor', modelo: 'HP P22A G4',
            servicoSolicitado: 'Substituição de monitor com defeito na unidade.',
            status: 'Subs. Equip. Defeito', predioDestino: 'Forum Criminal',
            setorDestino: '1VCJ - 1ª Vara Criminal do Júri', ttr: ttrS[0], tecnico: tecnicos[0]
          }, { usuario: 'sistema' });
          if (!s1.ok) throw new Error('seed de saída falhou: ' + s1.erro);
          var s2 = await S.registrarSaida({
            dataSaida: diasAtras(0), chamado: 'CH-10488', tomboNovo: '051010', tomboAntigo: '',
            equipamento: 'Headset', modelo: 'Logitech',
            servicoSolicitado: 'Atendimento a solicitação de novo posto de trabalho.',
            status: 'Solicitação', predioDestino: 'PA - Iracema',
            setorDestino: 'SADA - Setor de Atendimento', ttr: ttrS[1], tecnico: tecnicos[1]
          }, { usuario: 'sistema' });
          if (!s2.ok) throw new Error('seed de saída falhou: ' + s2.erro);
          await aguardar(function () { return S.resumo().totalCadastrado === 18; }, 30000);
        }

        await t('semeadura do inventário fictício (18 equipamentos, 2 saídas)', async function () {
          await semear();
          return S.resumo().totalCadastrado + ' equipamentos semeados';
        });

        /* ---- 1. Carregamento dos módulos ---- */
        await t('status por contexto: entrada, saída e estoque', function () {
          var ent = L.statusDe('entrada'), sai = L.statusDe('saida'), est = L.statusDe('estoque');
          ['Estoque', 'Manutenção', 'Defeito', 'Leilão', 'Entrada de Estoque', 'Devolução',
           'Devolução Empréstimo', 'Substituição', 'Substituição Defeito',
           'Devolucao Defeito', 'Devolução Eq. Obsoleto'].forEach(function (s) {
            if (ent.indexOf(s) === -1) throw new Error('falta na entrada: ' + s);
          });
          ['Solicitação', 'Subs. Equip. Obsoleto', 'Empréstimo', 'Manutenção',
           'Doação', 'Substituição', 'Subs. Equip. Defeito'].forEach(function (s) {
            if (sai.indexOf(s) === -1) throw new Error('falta na saída: ' + s);
          });
          if (est.indexOf('Disponibilizado') === -1) throw new Error('falta no estoque');
          return ent.length + ' entrada · ' + sai.length + ' saída · ' + est.length + ' estoque';
        });

        await t('TTR tem lista própria por contexto', function () {
          eq(L.ttrDe('entrada').join('|'), 'Realizada|Pendente|Retornou|Não consta no GRP|Garantia', 'TTR entrada');
          eq(L.ttrDe('saida').join('|'), 'Realizada|Pendente|Retornou|Empréstimo|Nao consta no GRP', 'TTR saída');
          return '5 + 5 opções';
        });

        await t('status não tem rótulo duplicado', function () {
          var vistos = {};
          L.get('status').forEach(function (s) {
            var k = L._chave(s.valor);
            if (vistos[k]) throw new Error('status duplicado: ' + s.valor);
            vistos[k] = true;
          });
          return L.get('status').length + ' status únicos';
        });

        await t('todos os módulos expostos', function () {
          ['util', 'ui', 'listas', 'store', 'auth', 'charts', 'exportar',
           'gerenciador', 'importar', 'app', 'pages', 'fb'].forEach(function (k) {
            if (!C[k]) throw new Error('faltando SAGETI.' + k);
          });
          ['login', 'dashboard', 'estoque', 'entrada', 'saida', 'relatorios',
           'configuracoes'].forEach(function (k) {
            if (!C.pages[k] || typeof C.pages[k].montar !== 'function') throw new Error('página inválida: ' + k);
          });
          return '7 páginas registradas';
        });

        await t('nenhum modelo fica inacessível no select filtrado', function () {
          var total = L.get('modelos').length;
          L.get('equipamentos').forEach(function (e) {
            var g = L.modelosDe(e);
            eq(g.sugeridos.length + g.outros.length, total, 'total em ' + e);
          });
          return 'todos os ' + total + ' modelos alcançáveis em cada categoria';
        });

        await t('todo modelo mapeado existe na lista mestre', function () {
          var mapa = C.MODELOS_POR_EQUIPAMENTO;
          var todos = L.get('modelos');
          Object.keys(mapa).forEach(function (cat) {
            mapa[cat].forEach(function (m) {
              if (todos.indexOf(m) === -1) throw new Error('modelo fantasma: ' + m + ' em ' + cat);
            });
          });
          return true;
        });

        await t('acessos antigos (SAGETI.EQUIPAMENTOS…) leem das listas dinâmicas', function () {
          eq(C.EQUIPAMENTOS.length, L.get('equipamentos').length, 'equipamentos');
          eq(C.SETORES.length, 175, 'setores');
          eq(C.TECNICOS.length, 15, 'técnicos');
          return 'compatibilidade preservada';
        });

        /* ---- 2. Utilitários ---- */
        await t('util.dataBR não desloca por fuso', function () { return eq(U.dataBR('2026-07-31'), '31/07/2026'); });
        await t('util.slug remove acentos', function () { return eq(U.slug('Comarca de Mucajaí ÃÕ'), 'comarca de mucajai ao'); });
        await t('util.esc bloqueia injeção', function () {
          return eq(U.esc('<img src=x onerror=alert(1)>'), '&lt;img src=x onerror=alert(1)&gt;');
        });
        await t('util.ordenarPor ordena texto e número', function () {
          var l = [{ a: '10' }, { a: '2' }, { a: '1' }];
          return eq(U.ordenarPor(l, 'a', 'asc').map(function (x) { return x.a; }).join(','), '1,2,10');
        });

        /* ---- 3. Estado inicial (seed) ---- */
        var r0 = S.resumo();
        await t('seed criou o inventário de demonstração', function () {
          if (r0.totalCadastrado < 15) throw new Error('só ' + r0.totalCadastrado + ' equipamentos');
          return r0.totalCadastrado + ' cadastrados · ' + r0.totalNoLab + ' no laboratório';
        });

        await t('resumo bate com a soma dos status', function () {
          var soma = 0;
          Object.keys(r0.porStatus).forEach(function (k) { soma += r0.porStatus[k]; });
          return eq(soma, r0.totalCadastrado, 'soma dos status');
        });

        await t('totalNoLab exclui os itens que saíram', function () {
          eq(r0.totalNoLab, r0.totalCadastrado - r0.totalFora, 'no laboratório');
          return r0.totalNoLab + ' de ' + r0.totalCadastrado + ' (' + r0.totalFora + ' fora)';
        });

        /* ---- 4. Entrada ---- */
        await t('entrada cria equipamento novo e emite evento', async function () {
          // O emit() de verdade agora vem do onSnapshot (evento genérico
          // "sync"), não mais de um tipo específico por operação — a prova
          // de "emitiu" é o espelho local realmente ter recebido a mudança.
          var antesEv = eventos.length;
          var res = await S.registrarEntrada({
            dataEntrada: '2026-07-20', chamado: 'CH-TEST-1',
            tomboNovo: '999001', tomboAntigo: '',
            equipamento: 'Monitor', modelo: 'LG E2241PX',
            servicoSolicitado: 'Teste automatizado', status: 'Estoque',
            predioOrigem: 'Palácio', setorOrigem: 'Teste', ttr: 'Pendente'
          });
          if (!res.ok || !res.criado) throw new Error('não criou');
          await aguardar(function () { return S.resumo().totalNoLab === r0.totalNoLab + 1; });
          if (eventos.length <= antesEv) throw new Error('nenhum evento emitido');
          return 'id ' + res.equipamento.id.slice(0, 8);
        });

        await t('reentrada do mesmo tombo atualiza em vez de duplicar', async function () {
          var antes = S.resumo().totalCadastrado;
          var res = await S.registrarEntrada({
            dataEntrada: '2026-07-25', chamado: 'CH-TEST-2',
            tomboNovo: '999001', equipamento: 'Monitor', modelo: 'LG E2241PX',
            status: 'Manutenção', predioOrigem: 'Forum Civel', setorOrigem: 'Reparo', ttr: 'Realizado'
          });
          if (res.criado) throw new Error('duplicou o registro');
          await aguardar(function () { return S.resumo().totalCadastrado === antes; });
          eq(res.equipamento.status, 'Manutenção', 'status atualizado');
          return 'atualizado, sem duplicata';
        });

        await t('entrada casa pelo tombo antigo quando o novo está vazio', async function () {
          await S.registrarEntrada({
            dataEntrada: '2026-07-21', tomboNovo: '', tomboAntigo: '888777',
            equipamento: 'Headset', modelo: 'Agem', status: 'Estoque',
            predioOrigem: 'CSE', setorOrigem: 'X', ttr: 'Pendente'
          });
          await aguardar(function () { return !!S.acharPorTombo({ tomboAntigo: '888777' }); });
          var antes = S.resumo().totalCadastrado;
          var res = await S.registrarEntrada({
            dataEntrada: '2026-07-22', tomboNovo: '', tomboAntigo: '888777',
            equipamento: 'Headset', modelo: 'Agem', status: 'Defeito',
            predioOrigem: 'CSE', setorOrigem: 'X', ttr: 'Pendente'
          });
          if (res.criado) throw new Error('duplicou pelo tombo antigo');
          await aguardar(function () { return S.acharPorTombo({ tomboAntigo: '888777' }).status === 'Defeito'; });
          return eq(S.resumo().totalCadastrado, antes, 'sem duplicata');
        });

        /* ---- 5. Saída ---- */
        await t('saída tira o item do estoque do laboratório', async function () {
          var antesLab = S.resumo().totalNoLab;
          var antesEv = eventos.length;
          var res = await S.registrarSaida({
            dataSaida: '2026-07-30', chamado: 'CH-TEST-3',
            tomboNovo: '999001', equipamento: 'Monitor', modelo: 'LG E2241PX',
            servicoSolicitado: 'Entrega', predioDestino: 'PA - Iracema',
            setorDestino: 'Atendimento', ttr: 'Realizado'
          });
          if (!res.ok) throw new Error(res.erro);
          eq(res.equipamento.status, 'Disponibilizado', 'status');
          await aguardar(function () { return S.resumo().totalNoLab === antesLab - 1; });
          if (eventos.length <= antesEv) throw new Error('nenhum evento emitido');
          return 'estoque ' + antesLab + ' → ' + S.resumo().totalNoLab;
        });

        await t('o registro sobrevive à saída (rastreabilidade)', function () {
          var eq1 = S.acharPorTombo({ tomboNovo: '999001' });
          if (!eq1) throw new Error('registro sumiu');
          eq(eq1.predioDestino, 'PA - Iracema', 'destino');
          return 'destino preservado';
        });

        await t('saída repetida é recusada', async function () {
          var res = await S.registrarSaida({
            dataSaida: '2026-07-31', tomboNovo: '999001',
            equipamento: 'Monitor', modelo: 'LG E2241PX', predioDestino: 'CSE', ttr: 'Pendente'
          });
          if (res.ok) throw new Error('permitiu saída dupla');
          return 'recusada: ' + res.erro.slice(0, 40) + '…';
        });

        await t('saída de tombo inexistente é recusada', async function () {
          var res = await S.registrarSaida({
            dataSaida: '2026-07-31', tomboNovo: 'NAO-EXISTE',
            equipamento: 'Monitor', modelo: 'LG E2241PX', predioDestino: 'CSE', ttr: 'Pendente'
          });
          if (res.ok) throw new Error('permitiu saída fantasma');
          return 'recusada';
        });

        await t('reentrada após saída devolve o item ao estoque e limpa o destino', async function () {
          var antes = S.resumo().totalNoLab;
          var res = await S.registrarEntrada({
            dataEntrada: '2026-07-31', tomboNovo: '999001',
            equipamento: 'Monitor', modelo: 'LG E2241PX', status: 'Estoque',
            predioOrigem: 'PA - Iracema', setorOrigem: 'Atendimento', ttr: 'Pendente'
          });
          if (!res.ok) throw new Error(res.erro);
          eq(res.equipamento.predioDestino, '', 'destino limpo');
          eq(res.equipamento.dataSaida, '', 'data de saída limpa');

              return L.statusMeta(e.status).tom === 'critical';
            });
            if (!todosCriticos) throw new Error('entrou item de outro tom no recorte');
            return comDefeito.length + ' com defeito de ' + antes;
          });

          await t('filtro por status individual recorta mais fino que o tom', function () {
            remontar();
            var status = S.estoqueLaboratorio()[0].status;
            var esperado = S.estoqueLaboratorio().filter(function (e) { return e.status === status; }).length;
            var sel = palco2.querySelector('#dash-status');
            sel.value = status;
            sel.dispatchEvent(new Event('change'));
            eq(D._filtro().status, status, 'filtro registrado');
            eq(D._recorte().length, esperado, 'tamanho do recorte');
            return status + ': ' + esperado + ' item(ns)';
          });

          await t('cada gráfico ignora a própria dimensão (não vira barra única)', function () {
            remontar();
            D._filtro().tom = 'critical';
            D._filtro().equipamento = S.estoqueLaboratorio()[0].equipamento;

            var paraDonut = D._recorte('tom');
            var tons = {};
            paraDonut.forEach(function (e) { tons[L.statusMeta(e.status).tom] = true; });
            if (Object.keys(tons).length < 1) throw new Error('donut ficou sem dados');

            var paraTipo = D._recorte('equipamento');
            if (paraTipo.some(function (e) { return L.statusMeta(e.status).tom !== 'critical'; })) {
              throw new Error('o filtro de situação não foi aplicado às barras');
            }
            return 'dimensões cruzadas corretamente';
          });

          await t('filtros combinam (modelo + situação + equipamento)', function () {
            remontar();
            var f = D._filtro();
            f.modelo = 'Ragtech Easy Way 1200';
            f.tom = 'critical';
            var r = D._recorte();
            var ok = r.every(function (e) {
              return e.modelo === 'Ragtech Easy Way 1200' &&
                     L.statusMeta(e.status).tom === 'critical';
            });
            if (!ok) throw new Error('o recorte combinado deixou passar item errado');
            return r.length + ' item(ns) atendem aos dois filtros';
          });

          await t('chips mostram os filtros ativos e permitem remover', function () {
            remontar();
            var f = D._filtro();
            f.modelo = 'Ragtech Easy Way 1200';
            f.tom = 'warning';
            palco2.querySelector('#dash-modelo').dispatchEvent(new Event('change'));

            var chips = palco2.querySelectorAll('[data-remover]');
            if (chips.length < 1) throw new Error('nenhum chip renderizado');
            var alvo = palco2.querySelector('[data-remover="tom"]');
            if (!alvo) throw new Error('sem chip para a situação');
            alvo.click();
            eq(D._filtro().tom, '', 'filtro de situação removido');
            return chips.length + ' chip(s), remoção funcionando';
          });

          await t('"Limpar tudo" zera o drill-down', function () {
            remontar();
            var f = D._filtro();
            f.modelo = 'Ragtech Easy Way 1200';
            f.equipamento = 'Nobreak';
            f.tom = 'critical';
            palco2.querySelector('#dash-modelo').dispatchEvent(new Event('change'));

            var btn = palco2.querySelector('[data-limpar-dash]');
            if (!btn) throw new Error('sem o botão Limpar tudo');
            btn.click();
            var d = D._filtro();
            if (d.modelo || d.equipamento || d.tom || d.predio || d.status) throw new Error('sobrou filtro');
            eq(D._recorte().length, S.estoqueLaboratorio().length, 'voltou ao total');
            return 'limpo';
          });

          await t('barras de tipo listam as categorias, inclusive as zeradas', function () {
            remontar();
            D._filtro().tom = 'critical';
            palco2.querySelector('#dash-tom').value = 'critical';
            palco2.querySelector('#dash-tom').dispatchEvent(new Event('change'));

            var linhas = palco2.querySelectorAll(
              '[data-vista-alvo="tabela"][data-chave="tipo"] tbody tr');
            eq(linhas.length, L.get('equipamentos').length, 'linhas na tabela de tipos');

            var comZero = Array.prototype.filter.call(linhas, function (tr) {
              return tr.lastElementChild.textContent.trim() === '0';
            }).length;
            if (!comZero) throw new Error('nenhuma categoria zerada foi listada');
            return linhas.length + ' categorias · ' + comZero + ' zeradas exibidas';
          });

          await t('drill-down sobrevive a uma nova entrada em tempo real', async function () {
            remontar();
            D._filtro().equipamento = 'Monitor';
            palco2.querySelector('#dash-equip').value = 'Monitor';
            palco2.querySelector('#dash-equip').dispatchEvent(new Event('change'));
            var antes = D._recorte().length;

            await S.registrarEntrada({
              dataEntrada: new Date().toISOString().slice(0, 10), tomboNovo: '222001',
              equipamento: 'Monitor', modelo: 'HP P22A G4', status: 'Estoque',
              predioOrigem: 'CSE', setorOrigem: 'OAB', ttr: 'Pendente'
            });

            await aguardar(function () { return D._recorte().length === antes + 1; });
            eq(D._filtro().equipamento, 'Monitor', 'filtro preservado');
            var hero = palco2.querySelector('.stat--hero .stat__value').textContent.trim();
            eq(hero, U.numero(antes + 1), 'hero repintado');
            return antes + ' → ' + (antes + 1);
          });

          await t('gráficos continuam desenhando com filtro ativo', function () {
            remontar();
            D._filtro().tom = 'good';
            palco2.querySelector('#dash-tom').value = 'good';
            palco2.querySelector('#dash-tom').dispatchEvent(new Event('change'));
            var canvases = palco2.querySelectorAll('canvas').length;
            var vazios = palco2.querySelectorAll('.chart-empty').length;
            if (canvases < 3) throw new Error('só ' + canvases + ' canvas');
            if (vivo2 && vivo2.destruir) vivo2.destruir();
            palco2.remove();
            return canvases + ' canvas · ' + vazios + ' vazio(s)';
          });
        }

        /* ---- 16. Erros globais ---- */
        await t('nenhum erro global durante a execução', function () {
          if (window.__erros.length) throw new Error(window.__erros.join(' | '));
          return 'console limpo';
        });
      }

      async function finalizar() {
        try { await rodar(); }
        catch (e) { falhas++; linhas.push('FATAL  ' + e.message + '\n' + e.stack); }

        var cabecalho = '===== SAGE-TI AUTOTESTE (emulador local) =====\n' +
          'aprovados: ' + ok + '   falhas: ' + falhas + '\n' +
          '===============================================\n';
        document.getElementById('saida').textContent =
          cabecalho + linhas.join('\n') + '\n===== FIM (' + (falhas ? 'FALHOU' : 'PASSOU') + ') =====';
      }

      if (document.readyState === 'complete') setTimeout(finalizar, 300);
      else window.addEventListener('load', function () { setTimeout(finalizar, 300); });
    })();
  </script>
</body>
</html>
