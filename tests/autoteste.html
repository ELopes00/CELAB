<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>SAGE-TI — Autoteste</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <div class="toast-stack" id="toast-stack"></div>
  <pre id="saida">executando…</pre>

  <script src="../js/config.js"></script>
  <script src="../js/config.properties.js"></script>
  <script src="../js/status-cores.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/listas.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/export.js"></script>
  <script src="../js/gerenciador.js"></script>
  <script src="../js/importar.js"></script>
  <script src="../js/scanner.js"></script>
  <script src="../js/pages/login.js"></script>
  <script src="../js/pages/dashboard.js"></script>
  <script src="../js/pages/estoque.js"></script>
  <script src="../js/pages/entrada.js"></script>
  <script src="../js/pages/saida.js"></script>
  <script src="../js/pages/relatorios.js"></script>
  <script src="../js/pages/configuracoes.js"></script>
  <script defer src="../js/app.js"></script>

  <script>
    window.__erros = [];
    window.addEventListener('error', function (e) {
      window.__erros.push('ERRO GLOBAL: ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
    });
  </script>

  <script defer>
    (function () {
      var linhas = [];
      var ok = 0, falhas = 0;

      function t(nome, fn) {
        try {
          var r = fn();
          if (r === false) { falhas++; linhas.push('FALHA  ' + nome); }
          else { ok++; linhas.push('ok     ' + nome + (typeof r === 'string' ? '  → ' + r : '')); }
        } catch (e) {
          falhas++;
          linhas.push('ERRO   ' + nome + '  → ' + (e && e.message) + '\n       ' +
            String(e && e.stack || '').split('\n')[1]);
        }
      }
      function eq(a, b, rot) {
        if (a !== b) throw new Error((rot || 'esperado') + ': ' + JSON.stringify(b) + ', obtido ' + JSON.stringify(a));
        return String(a);
      }

      function rodar() {
        var C = window.SAGETI;
        var S = C.store, U = C.util;

        var L = C.listas;

        /* ---- 1. Carregamento dos módulos ---- */
        t('listas carregadas com os tamanhos esperados', function () {
          eq(L.get('equipamentos').length, 14, 'equipamentos');
          eq(L.get('modelos').length, 45, 'modelos');
          eq(L.get('predios').length, 32, 'prédios');
          eq(L.get('setores').length, 175, 'setores');
          eq(L.get('tecnicos').length, 15, 'técnicos');
          return '175 setores · 15 técnicos · 45 modelos';
        });

        t('status por contexto: entrada, saída e estoque', function () {
          var ent = L.statusDe('entrada'), sai = L.statusDe('saida'), est = L.statusDe('estoque');
          ['Estoque', 'Manutenção', 'Defeito', 'Leilão', 'Entrada de Estoque', 'Devolução',
           'Devolução Empréstimo', 'Substituição', 'Substituição Defeito',
           'Devolucao Defeito', 'Devolução Eq. Obsoleto'].forEach(function (s) {
            if (ent.indexOf(s) === -1) throw new Error('falta na entrada: ' + s);
          });
          ['Solicitação', 'Subs. Equip. Obsoleto', 'Empréstimo', 'Manutenção',
           'Doação', 'Substituição', 'Subs. Equip. Defeito'].forEach(function (s) {
            if (sai.indexOf(s) === -1) throw new Error('falta na saída: ' + s);
          });
          if (est.indexOf('Disponibilizado') === -1) throw new Error('falta no estoque');
          return ent.length + ' entrada · ' + sai.length + ' saída · ' + est.length + ' estoque';
        });

        t('TTR tem lista própria por contexto', function () {
          eq(L.ttrDe('entrada').join('|'), 'Realizada|Pendente|Retornou|Não consta no GRP|Garantia', 'TTR entrada');
          eq(L.ttrDe('saida').join('|'), 'Realizada|Pendente|Retornou|Empréstimo|Nao consta no GRP', 'TTR saída');
          return '5 + 5 opções';
        });

        t('status não tem rótulo duplicado', function () {
          var vistos = {};
          L.get('status').forEach(function (s) {
            var k = L._chave(s.valor);
            if (vistos[k]) throw new Error('status duplicado: ' + s.valor);
            vistos[k] = true;
          });
          return L.get('status').length + ' status únicos';
        });

        t('todos os módulos expostos', function () {
          ['util', 'ui', 'listas', 'store', 'auth', 'charts', 'exportar',
           'gerenciador', 'importar', 'app', 'pages'].forEach(function (k) {
            if (!C[k]) throw new Error('faltando SAGETI.' + k);
          });
          ['login', 'dashboard', 'estoque', 'entrada', 'saida', 'relatorios',
           'configuracoes'].forEach(function (k) {
            if (!C.pages[k] || typeof C.pages[k].montar !== 'function') throw new Error('página inválida: ' + k);
          });
          return '7 páginas registradas';
        });

        t('nenhum modelo fica inacessível no select filtrado', function () {
          var total = L.get('modelos').length;
          L.get('equipamentos').forEach(function (e) {
            var g = L.modelosDe(e);
            eq(g.sugeridos.length + g.outros.length, total, 'total em ' + e);
          });
          return 'todos os ' + total + ' modelos alcançáveis em cada categoria';
        });

        t('todo modelo mapeado existe na lista mestre', function () {
          var mapa = C.MODELOS_POR_EQUIPAMENTO;
          var todos = L.get('modelos');
          Object.keys(mapa).forEach(function (cat) {
            mapa[cat].forEach(function (m) {
              if (todos.indexOf(m) === -1) throw new Error('modelo fantasma: ' + m + ' em ' + cat);
            });
          });
          return true;
        });

        t('acessos antigos (SAGETI.EQUIPAMENTOS…) leem das listas dinâmicas', function () {
          eq(C.EQUIPAMENTOS.length, L.get('equipamentos').length, 'equipamentos');
          eq(C.SETORES.length, 175, 'setores');
          eq(C.TECNICOS.length, 15, 'técnicos');
          return 'compatibilidade preservada';
        });

        /* ---- 2. Utilitários ---- */
        t('util.dataBR não desloca por fuso', function () { return eq(U.dataBR('2026-07-31'), '31/07/2026'); });
        t('util.slug remove acentos', function () { return eq(U.slug('Comarca de Mucajaí ÃÕ'), 'comarca de mucajai ao'); });
        t('util.esc bloqueia injeção', function () {
          return eq(U.esc('<img src=x onerror=alert(1)>'), '&lt;img src=x onerror=alert(1)&gt;');
        });
        t('util.ordenarPor ordena texto e número', function () {
          var l = [{ a: '10' }, { a: '2' }, { a: '1' }];
          return eq(U.ordenarPor(l, 'a', 'asc').map(function (x) { return x.a; }).join(','), '1,2,10');
        });

        /* ---- 3. Estado inicial (seed) ---- */
        var r0 = S.resumo();
        t('seed criou o inventário de demonstração', function () {
          if (r0.totalCadastrado < 15) throw new Error('só ' + r0.totalCadastrado + ' equipamentos');
          return r0.totalCadastrado + ' cadastrados · ' + r0.totalNoLab + ' no laboratório';
        });

        t('resumo bate com a soma dos status', function () {
          var soma = 0;
          Object.keys(r0.porStatus).forEach(function (k) { soma += r0.porStatus[k]; });
          return eq(soma, r0.totalCadastrado, 'soma dos status');
        });

        t('totalNoLab exclui os itens que saíram', function () {
          // Presença física vem do campo `noLaboratorio`, não de um rótulo:
          // as saídas do seed usam "Subs. Equip. Defeito" e "Solicitação".
          eq(r0.totalNoLab, r0.totalCadastrado - r0.totalFora, 'no laboratório');
          return r0.totalNoLab + ' de ' + r0.totalCadastrado + ' (' + r0.totalFora + ' fora)';
        });

        /* ---- 4. Entrada ---- */
        var eventos = [];
        var cancelar = S.assinar(function (ev) { eventos.push(ev.tipo); });

        t('entrada cria equipamento novo e emite evento', function () {
          var res = S.registrarEntrada({
            dataEntrada: '2026-07-20', chamado: 'CH-TEST-1',
            tomboNovo: '999001', tomboAntigo: '',
            equipamento: 'Monitor', modelo: 'LG E2241PX',
            servicoSolicitado: 'Teste automatizado', status: 'Estoque',
            predioOrigem: 'Palácio', setorOrigem: 'Teste', ttr: 'Pendente'
          });
          if (!res.ok || !res.criado) throw new Error('não criou');
          eq(eventos[eventos.length - 1], 'entrada', 'evento emitido');
          eq(S.resumo().totalNoLab, r0.totalNoLab + 1, 'estoque incrementado');
          return 'id ' + res.equipamento.id.slice(0, 8);
        });

        t('reentrada do mesmo tombo atualiza em vez de duplicar', function () {
          var antes = S.resumo().totalCadastrado;
          var res = S.registrarEntrada({
            dataEntrada: '2026-07-25', chamado: 'CH-TEST-2',
            tomboNovo: '999001', equipamento: 'Monitor', modelo: 'LG E2241PX',
            status: 'Manutenção', predioOrigem: 'Forum Civel', setorOrigem: 'Reparo', ttr: 'Realizado'
          });
          if (res.criado) throw new Error('duplicou o registro');
          eq(S.resumo().totalCadastrado, antes, 'total inalterado');
          eq(res.equipamento.status, 'Manutenção', 'status atualizado');
          return 'atualizado, sem duplicata';
        });

        t('entrada casa pelo tombo antigo quando o novo está vazio', function () {
          S.registrarEntrada({
            dataEntrada: '2026-07-21', tomboNovo: '', tomboAntigo: '888777',
            equipamento: 'Headset', modelo: 'Agem', status: 'Estoque',
            predioOrigem: 'CSE', setorOrigem: 'X', ttr: 'Pendente'
          });
          var antes = S.resumo().totalCadastrado;
          var res = S.registrarEntrada({
            dataEntrada: '2026-07-22', tomboNovo: '', tomboAntigo: '888777',
            equipamento: 'Headset', modelo: 'Agem', status: 'Defeito',
            predioOrigem: 'CSE', setorOrigem: 'X', ttr: 'Pendente'
          });
          if (res.criado) throw new Error('duplicou pelo tombo antigo');
          return eq(S.resumo().totalCadastrado, antes, 'sem duplicata');
        });

        /* ---- 5. Saída ---- */
        t('saída tira o item do estoque do laboratório', function () {
          var antesLab = S.resumo().totalNoLab;
          var res = S.registrarSaida({
            dataSaida: '2026-07-30', chamado: 'CH-TEST-3',
            tomboNovo: '999001', equipamento: 'Monitor', modelo: 'LG E2241PX',
            servicoSolicitado: 'Entrega', predioDestino: 'PA - Iracema',
            setorDestino: 'Atendimento', ttr: 'Realizado'
          });
          if (!res.ok) throw new Error(res.erro);
          eq(res.equipamento.status, 'Disponibilizado', 'status');
          eq(S.resumo().totalNoLab, antesLab - 1, 'estoque decrementado');
          eq(eventos[eventos.length - 1], 'saida', 'evento');
          return 'estoque ' + antesLab + ' → ' + S.resumo().totalNoLab;
        });

        t('o registro sobrevive à saída (rastreabilidade)', function () {
          var eq1 = S.acharPorTombo({ tomboNovo: '999001' });
          if (!eq1) throw new Error('registro sumiu');
          eq(eq1.predioDestino, 'PA - Iracema', 'destino');
          return 'destino preservado';
        });

        t('saída repetida é recusada', function () {
          var res = S.registrarSaida({
            dataSaida: '2026-07-31', tomboNovo: '999001',
            equipamento: 'Monitor', modelo: 'LG E2241PX', predioDestino: 'CSE', ttr: 'Pendente'
          });
          if (res.ok) throw new Error('permitiu saída dupla');
          return 'recusada: ' + res.erro.slice(0, 40) + '…';
        });

        t('saída de tombo inexistente é recusada', function () {
          var res = S.registrarSaida({
            dataSaida: '2026-07-31', tomboNovo: 'NAO-EXISTE',
            equipamento: 'Monitor', modelo: 'LG E2241PX', predioDestino: 'CSE', ttr: 'Pendente'
          });
          if (res.ok) throw new Error('permitiu saída fantasma');
          return 'recusada';
        });

        t('reentrada após saída devolve o item ao estoque e limpa o destino', function () {
          var antes = S.resumo().totalNoLab;
          var res = S.registrarEntrada({
            dataEntrada: '2026-07-31', tomboNovo: '999001',
            equipamento: 'Monitor', modelo: 'LG E2241PX', status: 'Estoque',
            predioOrigem: 'PA - Iracema', setorOrigem: 'Atendimento', ttr: 'Pendente'
          });
          if (!res.ok) throw new Error(res.erro);
          eq(res.equipamento.predioDestino, '', 'destino limpo');
          eq(res.equipamento.dataSaida, '', 'data de saída limpa');
          return eq(S.resumo().totalNoLab, antes + 1, 'voltou ao estoque');
        });

        /* ---- 6. CRUD direto ---- */
        t('cadastro direto bloqueia tombo duplicado', function () {
          var res = S.criarEquipamento({
            equipamento: 'Monitor', modelo: 'LG E2241PX', tomboNovo: '999001', status: 'Estoque'
          });
          if (res.ok) throw new Error('permitiu tombo duplicado');
          return 'bloqueado';
        });

        t('edição não permite roubar o tombo de outro item', function () {
          var novo = S.criarEquipamento({
            equipamento: 'Webcam', modelo: 'Logitech C925e', tomboNovo: '777001', status: 'Estoque'
          });
          if (!novo.ok) throw new Error('não criou o item de apoio');
          var res = S.atualizarEquipamento(novo.equipamento.id, { tomboNovo: '999001' });
          if (res.ok) throw new Error('permitiu colisão de tombo');
          return 'colisão bloqueada';
        });

        t('alteração de status registra o histórico com o valor anterior', function () {
          var alvo = S.acharPorTombo({ tomboNovo: '777001' });
          S.atualizarEquipamento(alvo.id, { status: 'Defeito' });
          var mov = S.listarMovimentacoes()[0];
          eq(mov.tipo, 'AJUSTE', 'tipo');
          eq(mov.statusAnterior, 'Estoque', 'status anterior');
          return eq(mov.statusResultante, 'Defeito', 'status novo');
        });

        t('exclusão remove do estoque e fica no histórico', function () {
          var alvo = S.acharPorTombo({ tomboNovo: '777001' });
          var antes = S.resumo().totalCadastrado;
          var res = S.excluirEquipamento(alvo.id);
          if (!res.ok) throw new Error(res.erro);
          eq(S.resumo().totalCadastrado, antes - 1, 'removido');
          return eq(S.listarMovimentacoes()[0].tipo, 'EXCLUSAO', 'histórico');
        });

        /* ---- 7. Histórico e série ---- */
        t('histórico registra todos os tipos de movimentação', function () {
          var tipos = {};
          S.listarMovimentacoes().forEach(function (m) { tipos[m.tipo] = (tipos[m.tipo] || 0) + 1; });
          ['ENTRADA', 'SAIDA', 'AJUSTE', 'CADASTRO', 'EXCLUSAO'].forEach(function (k) {
            if (!tipos[k]) throw new Error('sem registros do tipo ' + k);
          });
          return Object.keys(tipos).map(function (k) { return k + '=' + tipos[k]; }).join(' ');
        });

        t('série de 30 dias tem tamanho e soma coerentes', function () {
          var s = S.serieMovimentacoes(30);
          eq(s.labels.length, 30, 'dias');
          eq(s.entradas.length, 30, 'entradas');
          if (s.entradas.reduce(function (a, b) { return a + b; }, 0) === 0) throw new Error('sem entradas no período');
          return '30 dias · ' + s.entradas.reduce(function (a, b) { return a + b; }, 0) + ' entradas';
        });

        /* ---- 8. Persistência e backup ---- */
        t('exportarJSON / importarJSON preservam os dados', function () {
          var json = S.exportarJSON();
          var antes = S.resumo().totalCadastrado;
          var res = S.importarJSON(json);
          if (!res.ok) throw new Error(res.erro);
          return eq(S.resumo().totalCadastrado, antes, 'total após reimportação');
        });

        t('importarJSON rejeita conteúdo inválido', function () {
          if (S.importarJSON('{isso nao e json').ok) throw new Error('aceitou lixo');
          if (S.importarJSON('{"foo":1}').ok) throw new Error('aceitou estrutura errada');
          return 'rejeitado';
        });

        t('dados sobrevivem no localStorage', function () {
          var bruto = localStorage.getItem(C.APP.storageKey);
          if (!bruto) throw new Error('nada gravado');
          var d = JSON.parse(bruto);
          if (!d.equipamentos.length) throw new Error('gravou vazio');
          return Math.round(bruto.length / 1024) + ' KB gravados';
        });

        cancelar();
        t('cancelar assinatura para de notificar', function () {
          var n = eventos.length;
          S.criarEquipamento({ equipamento: 'HDMI', modelo: 'HDMI - 5M', tomboNovo: '666001', status: 'Estoque' });
          return eq(eventos.length, n, 'nenhum evento novo');
        });

        /* ---- 9. Autenticação ---- */
        t('login rejeita credencial errada', function () {
          if (C.auth.entrar('admin', 'errada').ok) throw new Error('aceitou senha errada');
          return 'rejeitado';
        });
        t('login aceita a credencial padrão e define o perfil', function () {
          var res = C.auth.entrar('admin', 'admin123');
          if (!res.ok) throw new Error('recusou credencial válida');
          eq(res.usuario.perfil, 'admin', 'perfil');
          if (!C.auth.permissao('podeExcluir')) throw new Error('admin sem permissão de exclusão');
          return 'admin autenticado';
        });
        t('perfil técnico não pode excluir', function () {
          C.auth.entrar('tecnico', 'tecnico123');
          if (C.auth.permissao('podeExcluir')) throw new Error('técnico pode excluir');
          if (!C.auth.permissao('podeEditar')) throw new Error('técnico não pode editar');
          C.auth.entrar('admin', 'admin123');
          return 'permissões corretas';
        });

        /* ---- 10. Camada visual ---- */
        t('chips de status cobrem os 5 estados', function () {
          C.STATUS_TODOS.forEach(function (s) {
            var html = C.ui.chipStatus(s);
            if (html.indexOf('chip--ajuste') > -1) throw new Error('status sem chip próprio: ' + s);
            if (html.indexOf(s) === -1) throw new Error('chip sem rótulo textual: ' + s);
          });
          return 'todos com cor + rótulo';
        });

        t('Chart.js carregou e a paleta lê o CSS', function () {
          if (!C.charts.disponivel()) throw new Error('Chart.js ausente');
          var p = C.charts.paleta();
          eq(p.series[0], '#2a78d6', 'slot 1 (claro)');
          eq(p.status.critical, '#d03b3b', 'status crítico');
          eq(p.surface, '#fcfcfb', 'superfície clara');
          return '8 slots + 5 status';
        });

        t('paleta troca de passo no modo escuro', function () {
          C.ui.aplicarTema('dark');
          var d = C.charts.paleta();
          eq(d.series[0], '#3987e5', 'slot 1 (escuro)');
          eq(d.surface, '#1a1a19', 'superfície escura');
          C.ui.aplicarTema('light');
          return 'passos próprios, sem inversão automática';
        });

        t('colunas de exportação incluem técnico e presença física', function () {
          eq(C.exportar.COLS_ESTOQUE.length, 16, 'colunas do inventário');
          eq(C.exportar.COLS_MOV.length, 16, 'colunas do histórico');
          function tem(cols, chave) {
            if (!cols.some(function (c) { return c.chave === chave; })) {
              throw new Error('falta a coluna ' + chave);
            }
          }
          tem(C.exportar.COLS_ESTOQUE, 'tecnico');
          tem(C.exportar.COLS_ESTOQUE, 'noLaboratorio');
          tem(C.exportar.COLS_ESTOQUE, 'setorOrigem');
          tem(C.exportar.COLS_MOV, 'tecnico');
          return C.exportar.COLS_ESTOQUE.length + ' + ' + C.exportar.COLS_MOV.length + ' colunas';
        });

        t('exportação formata data e tipo de movimentação', function () {
          var m = C.exportar.matriz(
            [{ data: '2026-07-31', tipo: 'SAIDA', equipamento: 'Monitor', tomboNovo: '045118' }],
            C.exportar.COLS_MOV);
          eq(m.cabecalho[0], 'Data', 'cabeçalho');
          eq(m.linhas[0][0], '31/07/2026', 'data em pt-BR');
          eq(m.linhas[0][1], 'Saída', 'tipo legível');
          eq(m.linhas[0][5], '045118', 'tombo preservado como texto');
          return 'datas e rótulos traduzidos';
        });

        t('SheetJS gera um XLSX real a partir do inventário', function () {
          if (typeof XLSX === 'undefined') throw new Error('SheetJS não carregou');
          var m = C.exportar.matriz(S.listarEquipamentos(), C.exportar.COLS_ESTOQUE);
          var ws = XLSX.utils.aoa_to_sheet([m.cabecalho].concat(m.linhas));
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Inventário');
          var buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
          if (!buf || buf.byteLength < 1000) throw new Error('arquivo suspeito: ' + (buf && buf.byteLength));
          // Confere o ida-e-volta: o que foi escrito é lido de volta igual.
          var lido = XLSX.utils.sheet_to_json(XLSX.read(buf, { type: 'array' }).Sheets['Inventário'],
            { header: 1 });
          eq(lido[0][0], 'Equipamento', 'cabeçalho relido');
          eq(lido.length, m.linhas.length + 1, 'linhas relidas');
          return Math.round(buf.byteLength / 1024) + ' KB · ' + m.linhas.length + ' linhas';
        });

        t('jsPDF + autotable geram um PDF paginado', function () {
          if (!(window.jspdf && window.jspdf.jsPDF)) throw new Error('jsPDF não carregou');
          var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
          if (typeof doc.autoTable !== 'function') throw new Error('plugin autotable ausente');

            vivo = D.montar(palco2, function () {});
          }

          t('dashboard tem filtro global por modelo, equipamento e situação', function () {
            remontar();
            ['#dash-modelo', '#dash-equip', '#dash-tom'].forEach(function (sel) {
              if (!palco2.querySelector(sel)) throw new Error('falta o filtro ' + sel);
            });
            var opts = palco2.querySelectorAll('#dash-modelo option').length;
            eq(opts, L.get('modelos').length + 1, 'modelos no select (+ "Todos")');
            return opts + ' opções de modelo';
          });

          t('filtro por modelo recorta o conjunto', function () {
            remontar();
            var todos = S.estoqueLaboratorio();
            var alvo = todos.length ? todos[0].modelo : '';
            var esperado = todos.filter(function (e) { return e.modelo === alvo; }).length;

            var sel = palco2.querySelector('#dash-modelo');
            sel.value = alvo;
            sel.dispatchEvent(new Event('change'));

            eq(D._filtro().modelo, alvo, 'filtro registrado');
            eq(D._recorte().length, esperado, 'tamanho do recorte');
            if (esperado >= todos.length) throw new Error('o recorte não reduziu nada');
            return alvo + ': ' + esperado + ' de ' + todos.length;
          });

          t('KPI e centro do donut acompanham o filtro de modelo', function () {
            var hero = palco2.querySelector('.stat--hero .stat__value').textContent.trim();
            eq(hero, U.numero(D._recorte().length), 'hero do recorte');
            if (palco2.querySelector('.stat--hero .stat__label').textContent.indexOf('recorte') === -1) {
              throw new Error('o rótulo do hero não indicou o recorte');
            }
            return 'hero = ' + hero;
          });

          t('clique no donut filtra por situação (cross-filter)', function () {
            remontar();
            var antes = D._recorte().length;
            // Simula o clique numa fatia acionando o mesmo caminho do gráfico.
            D._filtro().tom = 'critical';
            var comDefeito = D._recorte();
            if (comDefeito.length >= antes) throw new Error('o recorte não reduziu');
            var todosCriticos = comDefeito.every(function (e) {
              return L.statusMeta(e.status).tom === 'critical';
            });
            if (!todosCriticos) throw new Error('entrou item de outro tom no recorte');
            return comDefeito.length + ' com defeito de ' + antes;
          });

          t('cada gráfico ignora a própria dimensão (não vira barra única)', function () {
            remontar();
            D._filtro().tom = 'critical';
            D._filtro().equipamento = S.estoqueLaboratorio()[0].equipamento;

            // O donut recebe recorte('tom'): mantém todas as situações visíveis.
            var paraDonut = D._recorte('tom');
            var tons = {};
            paraDonut.forEach(function (e) { tons[L.statusMeta(e.status).tom] = true; });
            if (Object.keys(tons).length < 1) throw new Error('donut ficou sem dados');

            // As barras de tipo recebem recorte('equipamento').
            var paraTipo = D._recorte('equipamento');
            if (paraTipo.some(function (e) { return L.statusMeta(e.status).tom !== 'critical'; })) {
              throw new Error('o filtro de situação não foi aplicado às barras');
            }
            return 'dimensões cruzadas corretamente';
          });

          t('filtros combinam (modelo + situação + equipamento)', function () {
            remontar();
            var f = D._filtro();
            f.modelo = 'Ragtech Easy Way 1200';
            f.tom = 'critical';
            var r = D._recorte();
            var ok = r.every(function (e) {
              return e.modelo === 'Ragtech Easy Way 1200' &&
                     L.statusMeta(e.status).tom === 'critical';
            });
            if (!ok) throw new Error('o recorte combinado deixou passar item errado');
            return r.length + ' item(ns) atendem aos dois filtros';
          });

          t('chips mostram os filtros ativos e permitem remover', function () {
            remontar();
            var f = D._filtro();
            f.modelo = 'Ragtech Easy Way 1200';
            f.tom = 'warning';
            palco2.querySelector('#dash-modelo').dispatchEvent(new Event('change'));

            var chips = palco2.querySelectorAll('[data-remover]');
            if (chips.length < 1) throw new Error('nenhum chip renderizado');
            var alvo = palco2.querySelector('[data-remover="tom"]');
            if (!alvo) throw new Error('sem chip para a situação');
            alvo.click();
            eq(D._filtro().tom, '', 'filtro de situação removido');
            return chips.length + ' chip(s), remoção funcionando';
          });

          t('"Limpar tudo" zera o drill-down', function () {
            remontar();
            var f = D._filtro();
            f.modelo = 'Ragtech Easy Way 1200';
            f.equipamento = 'Nobreak';
            f.tom = 'critical';
            palco2.querySelector('#dash-modelo').dispatchEvent(new Event('change'));

            var btn = palco2.querySelector('[data-limpar-dash]');
            if (!btn) throw new Error('sem o botão Limpar tudo');
            btn.click();
            var d = D._filtro();
            if (d.modelo || d.equipamento || d.tom || d.predio) throw new Error('sobrou filtro');
            eq(D._recorte().length, S.estoqueLaboratorio().length, 'voltou ao total');
            return 'limpo';
          });

          t('barras de tipo listam as 14 categorias, inclusive as zeradas', function () {
            remontar();
            D._filtro().tom = 'critical';
            palco2.querySelector('#dash-tom').value = 'critical';
            palco2.querySelector('#dash-tom').dispatchEvent(new Event('change'));

            // A tabela-gêmea é a fonte auditável do gráfico.
            var linhas = palco2.querySelectorAll(
              '[data-vista-alvo="tabela"][data-chave="tipo"] tbody tr');
            eq(linhas.length, L.get('equipamentos').length, 'linhas na tabela de tipos');

            var comZero = Array.prototype.filter.call(linhas, function (tr) {
              return tr.lastElementChild.textContent.trim() === '0';
            }).length;
            if (!comZero) throw new Error('nenhuma categoria zerada foi listada');
            return linhas.length + ' categorias · ' + comZero + ' zeradas exibidas';
          });

          t('drill-down sobrevive a uma nova entrada em tempo real', function () {
            remontar();
            D._filtro().equipamento = 'Monitor';
            palco2.querySelector('#dash-equip').value = 'Monitor';
            palco2.querySelector('#dash-equip').dispatchEvent(new Event('change'));
            var antes = D._recorte().length;

            S.registrarEntrada({
              dataEntrada: new Date().toISOString().slice(0, 10), tomboNovo: '222001',
              equipamento: 'Monitor', modelo: 'HP P22A G4', status: 'Estoque',
              predioOrigem: 'CSE', setorOrigem: 'OAB', ttr: 'Pendente'
            });

            eq(D._filtro().equipamento, 'Monitor', 'filtro preservado');
            eq(D._recorte().length, antes + 1, 'recorte atualizado');
            var hero = palco2.querySelector('.stat--hero .stat__value').textContent.trim();
            eq(hero, U.numero(antes + 1), 'hero repintado');
            return antes + ' → ' + (antes + 1);
          });

          t('gráficos continuam desenhando com filtro ativo', function () {
            remontar();
            D._filtro().tom = 'good';
            palco2.querySelector('#dash-tom').value = 'good';
            palco2.querySelector('#dash-tom').dispatchEvent(new Event('change'));
            var canvases = palco2.querySelectorAll('canvas').length;
            var vazios = palco2.querySelectorAll('.chart-empty').length;
            if (canvases < 3) throw new Error('só ' + canvases + ' canvas');
            if (vivo && vivo.destruir) vivo.destruir();
            palco2.remove();
            return canvases + ' canvas · ' + vazios + ' vazio(s)';
          });
        })();

        /* ---- 16. Erros globais ---- */
        t('nenhum erro global durante a execução', function () {
          if (window.__erros.length) throw new Error(window.__erros.join(' | '));
          return 'console limpo';
        });
      }

      function finalizar() {
        try { rodar(); }
        catch (e) { falhas++; linhas.push('FATAL  ' + e.message + '\n' + e.stack); }

        var cabecalho = '===== SAGE-TI AUTOTESTE =====\n' +
          'aprovados: ' + ok + '   falhas: ' + falhas + '\n' +
          '===========================\n';
        document.getElementById('saida').textContent =
          cabecalho + linhas.join('\n') + '\n===== FIM (' + (falhas ? 'FALHOU' : 'PASSOU') + ') =====';
      }

      if (document.readyState === 'complete') setTimeout(finalizar, 300);
      else window.addEventListener('load', function () { setTimeout(finalizar, 300); });
    })();
  </script>
</body>
</html>
